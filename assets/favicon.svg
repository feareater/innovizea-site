<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Innovizea">
  <!-- The site mark. Echoes the header wordmark, which is INNOVIZEA followed by an accent
       dot — so the favicon is that dot plus a slab I, the smallest piece of the lockup that
       still reads at 16px. Drawn as rects and a circle, never <text>: a favicon cannot rely
       on a font being present. Colours are the shell ink/accent tokens hard-coded, since an
       SVG loaded as an icon gets no stylesheet. -->
  <rect width="64" height="64" rx="14" fill="#0E1116"/>
  <rect x="7" y="7" width="50" height="50" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <g fill="#FFFFFF">
    <rect x="12" y="16" width="26" height="7" rx="1.5"/>
    <rect x="21" y="16" width="8"  height="32" rx="1.5"/>
    <rect x="12" y="41" width="26" height="7" rx="1.5"/>
  </g>
  <circle cx="46" cy="44" r="6.5" fill="#4EA1FF"/>
</svg>
